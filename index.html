<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="author" content="N. H. T">
    <title>Máy Scan EKG Lên HIS - N. H. T</title>
    <!-- Thư viện PeerJS (Truyền P2P trực tiếp vào RAM máy tính) -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <!-- Thư viện Cropper.js (Cắt, Xoay ảnh chuyên nghiệp) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; text-align: center; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* Thanh trạng thái trên cùng */
        .header { background: #1e293b; padding: 12px; border-bottom: 1px solid #334155; }
        .header h3 { font-size: 16px; color: #4ade80; margin-bottom: 4px; }
        #status { font-size: 14px; color: #94a3b8; font-weight: 500; }

        /* Màn hình chờ chụp ảnh */
        #startScreen { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; }
        .camera-btn {
            display: none; background: #22c55e; color: white; padding: 18px 30px; 
            border-radius: 50px; font-size: 18px; font-weight: bold; border: none; 
            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.4); width: 85%; max-width: 320px;
            cursor: pointer; text-align: center;
        }
        input[type="file"] { display: none; }

        /* Màn hình chỉnh sửa & Scan (Ẩn mặc định) */
        #editorScreen { display: none; flex: 1; flex-direction: column; height: calc(100vh - 60px); }
        
        /* Khu vực hiển thị ảnh Crop */
        .canvas-container { flex: 1; position: relative; background: #000; overflow: hidden; width: 100%; }
        #imageToCrop { max-width: 100%; display: block; }

        /* Hiệu ứng xem trước chế độ làm sáng Scan trên khung cắt */
        .scan-mode-preview .cropper-view-box img,
        .scan-mode-preview .cropper-canvas img {
            filter: contrast(1.45) brightness(1.12) saturate(1.3);
        }

        /* Thanh công cụ chỉnh sửa */
        .toolbar { background: #1e293b; padding: 10px; display: flex; justify-content: space-around; border-top: 1px solid #334155; }
        .tool-btn { background: #334155; color: #fff; border: none; padding: 10px 14px; border-radius: 8px; font-size: 13px; font-weight: 600; flex: 1; margin: 0 4px; cursor: pointer; transition: 0.2s; }
        .tool-btn.active { background: #3b82f6; color: #fff; box-shadow: 0 0 8px rgba(59, 130, 246, 0.6); }
        .tool-btn:active { transform: scale(0.95); }

        /* Thanh nút Gửi / Chụp lại */
        .action-bar { background: #0f172a; padding: 12px; display: flex; gap: 10px; }
        .btn-cancel { background: #ef4444; color: white; border: none; padding: 14px; border-radius: 10px; font-size: 16px; font-weight: bold; flex: 1; cursor: pointer; }
        .btn-send { background: #22c55e; color: white; border: none; padding: 14px; border-radius: 10px; font-size: 16px; font-weight: bold; flex: 2; box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3); cursor: pointer; }
        .author-note { margin-top: 24px; font-size: 12px; color: #475569; }
    </style>
</head>
<body>

    <div class="header">
        <h3>MÁY SCAN ĐIỆN TÂM ĐỒ (EKG)</h3>
        <p id="status">🔄 Đang kết nối tới máy tính...</p>
    </div>

    <!-- MÀN HÌNH 1: CHỤP ẢNH -->
    <div id="startScreen">
        <label for="fileInput" class="camera-btn" id="uploadLabel">📸 Mở Camera Chụp EKG</label>
        <input type="file" id="fileInput" accept="image/*" capture="environment">
        <p style="margin-top: 20px; font-size: 13px; color: #64748b; max-width: 280px;">
            Mẹo: Chụp ngang điện thoại và kéo khung chọn vùng băng giấy điện tim để ảnh rõ nét và gọn nhẹ nhất.
        </p>
        <p class="author-note">Tác giả: N. H. T</p>
    </div>

    <!-- MÀN HÌNH 2: CẮT, XOAY & LÀM SÁNG (Hiện sau khi chụp) -->
    <div id="editorScreen">
        <div class="canvas-container" id="cropContainer">
            <img id="imageToCrop" src="">
        </div>
        
        <!-- Công cụ chỉnh hình -->
        <div class="toolbar">
            <button class="tool-btn" onclick="rotateImg(-90)">↺ Xoay Trái</button>
            <button class="tool-btn" onclick="rotateImg(90)">↻ Xoay Phải</button>
            <button class="tool-btn" onclick="resetCrop()">📐 Đặt lại</button>
            <button class="tool-btn active" id="btnScanFilter" onclick="toggleScanMode()">✨ Làm Sáng Nền</button>
        </div>

        <!-- Nút thao tác chính -->
        <div class="action-bar">
            <button class="btn-cancel" onclick="cancelEdit()">📸 Chụp lại</button>
            <button class="btn-send" id="btnSend" onclick="processAndSend()">🚀 Gửi Ảnh Lên HIS</button>
        </div>
    </div>

    <script>
        const statusEl = document.getElementById('status');
        const uploadLabel = document.getElementById('uploadLabel');
        const fileInput = document.getElementById('fileInput');
        const startScreen = document.getElementById('startScreen');
        const editorScreen = document.getElementById('editorScreen');
        const imageToCrop = document.getElementById('imageToCrop');
        const cropContainer = document.getElementById('cropContainer');
        const btnScanFilter = document.getElementById('btnScanFilter');
        const btnSend = document.getElementById('btnSend');

        let cropper = null;
        let isScanMode = true; // Mặc định bật chế độ làm sáng rõ nét
        let conn = null;

        // 1. KẾT NỐI PEERJS TỚI MÁY TÍNH
        const urlParams = new URLSearchParams(window.location.search);
        const targetPeerId = urlParams.get('peer');

        if (!targetPeerId) {
            statusEl.innerText = "❌ Lỗi: Vui lòng quét mã QR từ máy tính!";
            statusEl.style.color = "#ef4444";
        } else {
            const peer = new Peer();
            peer.on('open', () => {
                conn = peer.connect(targetPeerId, { reliable: true });
                conn.on('open', () => {
                    statusEl.innerText = "✅ Đã kết nối máy tính! Sẵn sàng chụp.";
                    statusEl.style.color = "#4ade80";
                    uploadLabel.style.display = "block";
                });
                conn.on('close', () => {
                    statusEl.innerText = "❌ Đã ngắt kết nối với máy tính.";
                    statusEl.style.color = "#ef4444";
                    uploadLabel.style.display = "none";
                });
            });
        }

        // 2. KHI CHỤP ẢNH XONG -> MỞ KHUNG CHỌN VÙNG ĐIỆN TIM & XOAY
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                startScreen.style.display = 'none';
                editorScreen.style.display = 'flex';
                statusEl.innerText = "✂️ Xoay và kéo 4 góc để chọn vùng điện tim";

                imageToCrop.src = event.target.result;

                if (cropper) cropper.destroy();
                
                cropper = new Cropper(imageToCrop, {
                    viewMode: 1,
                    dragMode: 'move',
                    autoCropArea: 0.85,
                    restore: false,
                    guides: true,
                    center: true,
                    highlight: false,
                    cropBoxMovable: true,
                    cropBoxResizable: true,
                    toggleDragModeOnDblclick: false,
                    ready() {
                        if (isScanMode) cropContainer.classList.add('scan-mode-preview');
                    }
                });
            };
            reader.readAsDataURL(file);
        });

        // 3. CÁC HÀM ĐIỀU KHIỂN XOAY TRÁI, XOAY PHẢI, ĐẶT LẠI, LÀM SÁNG
        function rotateImg(degree) {
            if (cropper) cropper.rotate(degree);
        }

        function resetCrop() {
            if (cropper) cropper.reset();
        }

        function toggleScanMode() {
            isScanMode = !isScanMode;
            if (isScanMode) {
                btnScanFilter.classList.add('active');
                cropContainer.classList.add('scan-mode-preview');
            } else {
                btnScanFilter.classList.remove('active');
                cropContainer.classList.remove('scan-mode-preview');
            }
        }

        function cancelEdit() {
            if (cropper) { cropper.destroy(); cropper = null; }
            fileInput.value = "";
            editorScreen.style.display = 'none';
            startScreen.style.display = 'flex';
            statusEl.innerText = "✅ Sẵn sàng chụp ảnh mới.";
        }

        // 4. XỬ LÝ LÀM SÁNG, NÉN GỌN NHẸ & GỬI THẲNG VỀ RAM MÁY TÍNH
        function processAndSend() {
            if (!cropper || !conn) return;
            
            btnSend.innerText = "⏳ Đang xử lý & Gửi...";
            btnSend.disabled = true;

            // Thu gọn kích thước tối đa 1600px giúp ảnh sắc nét nhưng dung lượng cực nhẹ
            const croppedCanvas = cropper.getCroppedCanvas({
                maxWidth: 1600,
                maxHeight: 1600,
                imageSmoothingEnabled: true,
                imageSmoothingQuality: 'high'
            });

            const finalCanvas = document.createElement('canvas');
            finalCanvas.width = croppedCanvas.width;
            finalCanvas.height = croppedCanvas.height;
            const ctx = finalCanvas.getContext('2d');

            if (isScanMode) {
                // Tăng tương phản, làm sáng nền giấy và giữ rõ lưới đỏ EKG
                ctx.filter = 'contrast(1.45) brightness(1.12) saturate(1.3)';
            }
            
            ctx.drawImage(croppedCanvas, 0, 0);

            // Nén chuẩn JPEG (0.80) gọn nhẹ và truyền qua WebRTC thẳng vào RAM máy tính
            finalCanvas.toBlob((blob) => {
                conn.send({
                    fileName: "EKG_Scanned_" + Date.now() + ".jpg",
                    fileType: "image/jpeg",
                    fileData: blob
                });

                statusEl.innerText = "✅ Đã gửi ảnh sang máy tính!";
                btnSend.innerText = "🚀 Gửi Ảnh Lên HIS";
                btnSend.disabled = false;
                
                cancelEdit();
            }, 'image/jpeg', 0.80);
        }
    </script>
</body>
</html>
